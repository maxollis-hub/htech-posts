name: Diagnostico LinkedIn

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Testar caminhos da API do LinkedIn
        env:
          LI_TOKEN: ${{ secrets.LI_TOKEN }}
        run: python diagnostico_linkedin.py
      - name: Gravar resultado no repositorio
        if: always()
        run: |
          git config user.name  "robo-htech"
          git config user.email "robo@htechmotion.com.br"
          git add diagnostico-linkedin.txt || true
          git diff --cached --quiet || git commit -m "diagnostico linkedin $(date -u +'%d/%m/%Y %H:%M UTC')"
          git push || true
