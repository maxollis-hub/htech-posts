name: Publicar posts da fila

on:
  schedule:
    # MEDIDO em 08/09/2026: pedindo "*/10" (84 execucoes/dia) o GitHub entregou
    # 4 a 5 por dia, e num dia nenhuma. Cron de alta frequencia e o mais
    # estrangulado, e minuto redondo cai no pico de carga do GitHub. Entao
    # pedimos menos, em minutos quebrados: 2x por hora, das 07h as 20h BRT.
    # Continua sendo melhor-esforco — quem garante horario e o disparo externo.
    - cron: "13,43 10-23 * * 1-5"
  workflow_dispatch:        # permite disparar na mao pelo site do GitHub

permissions:
  contents: write           # para mover os posts publicados dentro do repo

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Publicar o que venceu
        env:
          META_TOKEN:     ${{ secrets.META_TOKEN }}
          FB_PAGE_ID:     ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:     ${{ secrets.IG_USER_ID }}
          LI_TOKEN:       ${{ secrets.LI_TOKEN }}
          LI_PERSON_URN:  ${{ secrets.LI_PERSON_URN }}   # opcional: se ausente, o robo descobre sozinho
          LI_ORG_URN:     ${{ secrets.LI_ORG_URN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python publicar.py

      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name  "robo-htech"
          git config user.email "robo@htech.local"
          git add -A fila/
          git diff --staged --quiet || git commit -m "publicado em $(date -u '+%d/%m/%Y %H:%M UTC')"
          git push || true
