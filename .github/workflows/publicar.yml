name: Publicar posts da fila

on:
  schedule:
    # a cada 10 min, das 07:00 as 20:50 de Brasilia, seg a sex
    # (o cron do GitHub e em UTC; Brasilia = UTC-3, sem horario de verao)
    - cron: "*/10 10-23 * * 1-5"
  workflow_dispatch:        # permite disparar na mao pelo site do GitHub

permissions:
  contents: write           # para mover os posts publicados dentro do repo

concurrency:
  group: publicar
  cancel-in-progress: false # nunca cancelar uma publicacao pela metade

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Publicar o que venceu
        env:
          META_TOKEN:     ${{ secrets.META_TOKEN }}
          FB_PAGE_ID:     ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID:     ${{ secrets.IG_USER_ID }}
          LI_TOKEN:       ${{ secrets.LI_TOKEN }}
          LI_PERSON_URN:  ${{ secrets.LI_PERSON_URN }}
          LI_ORG_URN:     ${{ secrets.LI_ORG_URN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python publicar.py

      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name  "robo-htech"
          git config user.email "robo@htech.local"
          git add -A fila/
          git diff --staged --quiet || git commit -m "publicado em $(date -u '+%d/%m/%Y %H:%M UTC')"
          git push || true
