name: Criar template do vigia

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  criar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
        run: python criar_template.py
      - if: always()
        run: |
          git config user.name  "robo-htech"
          git config user.email "robo@htechmotion.com.br"
          git add diagnostico-whatsapp.txt || true
          git diff --cached --quiet || git commit -m "criar template do vigia $(date -u +'%d/%m %H:%M UTC')"
          git push || true
